MOD_BSR_FORM_FIELD_QUICK_ORDER_NOTE_LABEL="Как пользоваться"
MOD_BSR_FORM_FIELD_QUICK_ORDER_NOTE_DESC="Кнопка открытия формы должна лежать внутри карточки товара. Модуль найдёт карточку по классу блока, возьмёт из неё название и подставит в форму и тему письма.<br><br>1. В поле <b>Класс блока</b> укажите CSS-класс карточки <i>без точки</i>, например: <code>product-card</code>.<br>2. В поле <b>Откуда брать название</b> укажите класс, тег или путь внутри этой карточки, например: <code>h3</code>, <code>.title</code> или <code>h3 &gt; span</code>.<br>3. Выберите тип заявки:<br>— <b>Консультация:</b> заголовок формы — текст кнопки, ниже строка «НА ТЕМУ: название». Тема письма так же.<br>— <b>Заказ:</b> заголовок и тема письма — текст кнопки и сразу название.<br><br>Пример разметки:<br><code>&lt;div class=""product-card""&gt;<br>&nbsp;&nbsp;&lt;h3&gt;&lt;span&gt;Натяжной потолок&lt;/span&gt;&lt;/h3&gt;<br>&nbsp;&nbsp;&lt;button class=""bsr-open-modal""&gt;Заказать&lt;/button&gt;<br>&lt;/div&gt;</code>"
