MOD_BSR_FORM_FIELD_QUICK_ORDER_NOTE_LABEL="How to use"
MOD_BSR_FORM_FIELD_QUICK_ORDER_NOTE_DESC="The form trigger button must be inside the product card. The module finds the card by its CSS class, reads the name, and puts it into the form and the email subject.<br><br>1. In <b>Block class</b> enter the card CSS class <i>without a dot</i>, e.g. <code>product-card</code>.<br>2. In <b>Where to take the name</b> enter a class, tag or path inside that card, e.g. <code>h3</code>, <code>.title</code> or <code>h3 &gt; span</code>.<br>3. Choose the request type:<br>— <b>Consultation:</b> form title is the button text, below it «ON THE TOPIC: name». Email subject follows the same pattern.<br>— <b>Order:</b> form title and email subject are the button text immediately followed by the name.<br><br>Markup example:<br><code>&lt;div class=""product-card""&gt;<br>&nbsp;&nbsp;&lt;h3&gt;&lt;span&gt;Stretch ceiling&lt;/span&gt;&lt;/h3&gt;<br>&nbsp;&nbsp;&lt;button class=""bsr-open-modal""&gt;Order&lt;/button&gt;<br>&lt;/div&gt;</code>"
